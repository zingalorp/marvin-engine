<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marvin</title>
<link rel="stylesheet" href="/static/chessground.base.css">
<link rel="stylesheet" href="/static/chessground.brown.css">
<link rel="stylesheet" href="/static/chessground.cburnett.css">
<style>
  :root { --bg: #f4f3f0; --fg: #222; --muted: #777; --panel: #fff; --line: #d8d6d0; --hover: #f0eee9;
          --on: #2f6f3e; --low: #b33; --w: #fff; --d: #a7a7a7; --b: #4d4d4d; --bar: #629924; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1b19; --fg: #ddd; --muted: #888; --panel: #2a2825; --line: #3b3935; --hover: #33312d;
            --w: #e8e8e8; --d: #8b8b8b; --b: #222; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
         font: 15px/1.4 system-ui, sans-serif; display: flex; justify-content: center; }
  main { width: min(100%, 560px); display: flex; flex-direction: column; gap: 16px; }
  #play { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  aside { display: none; flex-direction: column; gap: 12px; min-width: 0; }
  body.analysis aside, body.debug aside { display: flex; }
  @media (min-width: 1000px) {
    body.analysis main, body.debug main { width: min(100%, 1080px); flex-direction: row; align-items: flex-start; }
    body.analysis #play, body.debug #play { width: 560px; flex: none; }
    aside { flex: 1; }
  }
  .bar { display: flex; justify-content: space-between; align-items: center; }
  .clock { font: 600 22px ui-monospace, monospace; padding: 2px 10px; border-radius: 4px;
           background: var(--panel); border: 1px solid var(--line); }
  .clock.on { background: var(--on); border-color: var(--on); color: #fff; }
  .clock.on.low { background: var(--low); border-color: var(--low); }
  #board { width: 100%; aspect-ratio: 1; }
  .cg-wrap coords.files { left: 0; }  /* stock offset overflows the board */
  .cg-wrap coords.files coord { text-align: right; padding-right: 3px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  select, button, input { font: inherit; padding: 4px 8px; border-radius: 4px;
                          background: var(--panel); color: var(--fg); border: 1px solid var(--line); }
  select, button { cursor: pointer; }
  input[type=number] { width: 70px; }
  input[type=checkbox] { padding: 0; }
  details summary { cursor: pointer; color: var(--muted); }
  details .row { margin-top: 8px; }
  #boardwrap { position: relative; }
  /* Promotion choices as on Lichess: a column from the promotion square, queen first */
  #promo { position: absolute; inset: 0; z-index: 5; background: rgba(250, 250, 250, .7); }
  #promo[hidden] { display: none; }
  #promo div { position: absolute; width: 12.5%; height: 12.5%; cursor: pointer; border-radius: 50%;
               background: #b0b0b0; box-shadow: inset 0 0 25px 3px #808080; }
  #promo div:hover { border-radius: 0; box-shadow: inset 0 0 48px 8px #d85000; }
  #promo piece { width: 100%; height: 100%; transform: scale(.8); transition: transform .15s; }
  #promo div:hover piece { transform: none; }
  #status { font-weight: 600; min-height: 1.4em; }
  #nav { display: none; gap: 4px; }
  body.analysis #nav { display: flex; }
  body.analysis #resign { display: none; }
  #nav button { flex: 1; padding: 0; font-size: 20px; line-height: 28px; }
  #moves { color: var(--muted); font-size: 14px; line-height: 1.7; }
  #moves .mv { cursor: pointer; padding: 1px 3px; border-radius: 3px; }
  #moves .mv:hover { background: var(--hover); color: var(--fg); }
  #moves .mv.cur { background: var(--on); color: #fff; }
  #moves .var { color: var(--muted); opacity: .8; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
  #analysis { display: none; font-size: 14px; }
  body.analysis #analysis { display: block; }
  #analysis table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  #analysis th { text-align: left; font-weight: normal; color: var(--muted); padding: 4px 10px; }
  #analysis td { padding: 3px 10px; white-space: nowrap; }
  #analysis td.wdl { width: 55%; padding-left: 0; }
  #analysis tbody tr { cursor: pointer; }
  #analysis tbody tr:hover { background: var(--hover); }
  #analysis.stale table { opacity: .5; }
  #analysis tr.sum { cursor: default; border-top: 1px solid var(--line); }
  #analysis .num { text-align: right; }
  #analysis .time { color: var(--muted); text-align: right; }
  #analysis .foot { display: flex; justify-content: space-between; padding: 6px 10px; color: var(--muted);
                    border-top: 1px solid var(--line); }
  #analysis .foot button { padding: 0 8px; }
  .wdlbar { display: flex; height: 18px; border-radius: 3px; overflow: hidden; border: 1px solid var(--line); font-size: 11px; line-height: 18px; }
  .wdlbar span { text-align: center; overflow: hidden; }
  .wdlbar .w { background: var(--w); color: #333; }
  .wdlbar .d { background: var(--d); color: #fff; }
  .wdlbar .b { background: var(--b); color: #eee; }
  #popup { position: fixed; z-index: 20; width: 256px; padding: 8px 10px; font-size: 12px; pointer-events: none;
           box-shadow: 0 2px 8px #0004; }
  #popup .chart { display: flex; align-items: flex-end; gap: 1px; height: 44px; }
  #popup .chart i { flex: 1; background: var(--bar); }
  #popup .stats { display: flex; justify-content: space-between; gap: 10px; white-space: nowrap; }
  #popup .axis { position: relative; height: 15px; color: var(--muted); }
  #popup .axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  #popup .axis span:first-child { transform: none; }
  #popup .axis span:last-child { transform: translateX(-100%); }
  #popup .stats { color: var(--fg); margin-top: 4px; }
  #debug { display: none; min-width: 0; margin: 0; padding: 8px; overflow-x: auto;
           font: 11px/1.45 ui-monospace, monospace; white-space: pre; }
  body.debug #debug { display: block; }
  body.debug #debug:empty { display: none; }
</style>
</head>
<body>
<main>
  <section id="play">
    <div class="bar"><span id="topName"></span><span class="clock" id="topClock"></span></div>
    <div id="boardwrap"><div id="board"></div><div id="promo" class="cg-wrap" hidden></div></div>
    <div class="bar"><span id="botName"></span><span class="clock" id="botClock"></span></div>
    <div id="nav"><button data-nav="start" title="Start (Home)">«</button><button data-nav="back" title="Back (←)">‹</button>
      <button data-nav="forward" title="Forward (→)">›</button><button data-nav="end" title="End (End)">»</button></div>
    <div class="row">
      <select id="color"><option value="w">White</option><option value="b">Black</option><option value="r">Random</option></select>
      <label>Marvin <select id="bot"></select></label>
      <label>You <select id="you"></select></label>
      <select id="tc"></select>
      <button id="new">New game</button>
      <button id="resign">Resign</button>
    </div>
    <div class="row">
      <label>Temperature <input type="number" id="temperature" min="0" max="5" step="0.1"></label>
      <label>Top-p <input type="number" id="top_p" min="0.05" max="1" step="0.05"></label>
      <label><input type="checkbox" id="showAnalysis"> Analysis</label>
      <label><input type="checkbox" id="showDebug"> Debug</label>
      <label><input type="checkbox" id="sound"> Sound</label>
    </div>
    <details>
      <summary>Time settings</summary>
      <div class="row">
        <label>Think time <select id="think_time">
          <option value="sample">sample</option><option value="typical">typical</option>
          <option value="mean">mean</option><option value="mode">mode</option><option value="instant">instant</option>
        </select></label>
        <label>Temperature <input type="number" id="time_temperature" min="0" max="5" step="0.1"></label>
        <label>Top-p <input type="number" id="time_top_p" min="0.05" max="1" step="0.05"></label>
        <label>Scale <input type="number" id="time_scale" min="0" max="10" step="0.1"></label>
        <label title="Shows Marvin's moves this much later, like ping on Lichess. Marvin's clock isn't charged for it.">Lag (ms)
          <input type="number" id="lag" min="0" max="1000" step="10"></label>
      </div>
    </details>
    <div id="status"></div>
    <div id="moves"></div>
  </section>
  <aside>
    <div id="analysis" class="box"></div>
    <pre id="debug" class="box"></pre>
  </aside>
</main>
<div id="popup" class="box" hidden></div>
<script type="module">
import { Chessground } from "/static/chessground.min.js";
const NO_HOVER = matchMedia("(hover: none)").matches;  // phones and tablets


const TCS = ["1+0", "2+1", "3+0", "3+2", "5+0", "5+3", "10+0", "10+5", "15+10", "30+0"];
const ROLES = { q: "queen", n: "knight", r: "rook", b: "bishop" };  // Lichess's order in the promotion column
const CASTLE = { e1h1: "e1g1", e1a1: "e1c1", e8h8: "e8g8", e8a8: "e8c8" };  // king dropped on its rook
const GAME = ["color", "bot", "you", "tc"];
const SETTINGS = { temperature: 1, top_p: 1, think_time: "sample", time_temperature: 1, time_top_p: 1, time_scale: 1, lag: 100 };
const VIEW = ["showAnalysis", "showDebug", "sound"];
const $ = id => document.getElementById(id);
const side = c => (c === "w" ? "white" : "black");
const other = c => (c === "w" ? "b" : "w");
let g = null, cg = null, showAll = false;
const TOP_P = 0.98;  // the analysis list shows the moves covering this much probability

for (let e = 1200; e <= 2500; e += 100) for (const id of ["bot", "you"]) $(id).add(new Option(e, e));
for (const t of TCS) $("tc").add(new Option(t, t));
const saved = (() => { try { return JSON.parse(localStorage.getItem("marvin")) || {}; } catch { return {}; } })();
const prefs = { color: "w", bot: "1500", you: "1500", tc: "5+0", ...SETTINGS, showAnalysis: false, showDebug: false, sound: true, ...saved };
for (const id of [...GAME, ...Object.keys(SETTINGS)]) $(id).value = prefs[id];
for (const id of VIEW) $(id).checked = prefs[id];

function savePrefs() {
  const p = {};
  for (const id of [...GAME, ...Object.keys(SETTINGS)]) p[id] = $(id).value;
  for (const id of VIEW) p[id] = $(id).checked;
  try { localStorage.setItem("marvin", JSON.stringify(p)); } catch {}
  document.body.classList.toggle("analysis", p.showAnalysis);
  document.body.classList.toggle("debug", p.showDebug);
  return p;
}

function settings() {
  const s = {};
  for (const [id, fallback] of Object.entries(SETTINGS)) {
    s[id] = typeof fallback === "number" ? (Number.isFinite(+$(id).value) && $(id).value !== "" ? +$(id).value : fallback) : $(id).value;
  }
  return s;
}

async function post(path, body) {
  try {
    const r = await fetch(path, { method: "POST", body: JSON.stringify(body) });
    const out = await r.json();
    if (out.error) throw new Error(out.error);
    return out;
  } catch (e) {
    $("status").textContent = `Error: ${e.message}`;
    throw e;
  }
}

// --- game ----------------------------------------------------------------------------------
// Positions form a move tree. Each node holds its move, the time spent on it, the clocks after it
// and, once fetched, its position (`state`) and analysis. The game against Marvin is the path to
// `g.tip`. With analysis on, the board is free: you play both sides, nothing runs in real time,
// and each move spends the model's typical think time on the mover's clock.

const analysisOn = () => $("showAnalysis").checked;
const elo = () => ({ [g.human]: +$("you").value, [g.bot]: +$("bot").value });  // read live: changes apply at once

function newGame() {
  const p = savePrefs();
  const [min, inc] = p.tc.split("+").map(Number);
  const human = p.color === "r" ? (Math.random() < .5 ? "w" : "b") : p.color;
  const root = { ply: 0, uci: null, san: null, time: 0, parent: null, children: [], clock: { w: min * 60, b: min * 60 } };
  g = { human, bot: other(human), base: min * 60, inc, clock: { ...root.clock }, start: performance.now(),
        over: false, busy: false, id: (g?.id || 0) + 1, turn: 0, root, tip: root, view: root };
  drawNames();
  $("status").textContent = "";
  $("debug").textContent = "";
  closePromotion();
  cg?.destroy();
  cg = Chessground($("board"), {
    orientation: side(human),
    movable: { free: false, showDests: true, events: { after: onUserMove } },
    premovable: { enabled: true },
    animation: { duration: 150 },
  });
  sound("GenericNotify");
  refresh();
}

function drawNames() {
  $("topName").textContent = `Marvin (${$("bot").value})`;
  $("botName").textContent = `You (${$("you").value})`;
}

const pathTo = node => { const p = []; for (let n = node; n.parent; n = n.parent) p.unshift(n); return p; };
const moverAt = node => node.state.fen.split(" ")[1];
const playing = () => !analysisOn() && !g.over;  // a game against Marvin is running
const turn = () => moverAt(g.tip);
const lag = () => Math.min(1000, Math.max(0, settings().lag));  // ms, simulated ping on Marvin's moves
const timed = () => g.tip.ply >= 2;  // as on Lichess, clocks start after each side's first move
const elapsed = () => (playing() && timed() ? (performance.now() - g.start) / 1000 : 0);
const remaining = c => g.clock[c] - (g.tip.state && turn() === c ? elapsed() : 0);
const position = () => {
  const path = pathTo(g.tip);
  return { moves: path.map(n => n.uci), times: path.map(n => n.time), base: g.base, inc: g.inc, elo: elo(),
           clock: { w: remaining("w"), b: remaining("b") } };
};

async function refresh() {  // after a game move: load the new position and let whoever is to move
  const id = g.id, tip = g.tip;
  if (!tip.state) tip.state = await post("/state", { moves: pathTo(tip).map(n => n.uci) });
  if (id !== g.id || tip !== g.tip) return;
  if (tip.uci) tip.san = tip.state.san.at(-1);
  g.busy = false;
  if (tip.state.over) finish(tip.state.over.result, tip.state.over.reason);
  await show(tip);
  if (!playing()) return;
  if (turn() === g.bot) botMove();
  else cg.playPremove();
}

function play(uci, spent, recorded = spent) {  // a move in the game against Marvin
  if (!playing() || g.busy) return;  // busy: the previous move hasn't been applied yet
  if (!g.tip.state.legal.includes(uci)) return draw();  // never send an illegal move
  const c = turn();
  const time = timed() ? recorded : g.inc;
  if (timed()) g.clock[c] += g.inc - spent;
  g.busy = true;
  g.start = performance.now();
  const node = g.tip.children.find(n => n.uci === uci)
            ?? { ply: g.tip.ply + 1, uci, san: null, parent: g.tip, children: [] };
  if (!g.tip.children.includes(node)) g.tip.children.unshift(node);
  Object.assign(node, { time, clock: { ...g.clock }, analysis: null });  // the game's own times and clocks
  g.tip = g.view = node;
  closePromotion();
  return refresh();
}

async function botMove() {
  const id = g.id, turnId = ++g.turn;
  const r = await post("/move", { ...position(), settings: settings() });
  if (id !== g.id || turnId !== g.turn || !playing()) return;  // paused, resumed elsewhere, or a new game
  $("debug").textContent = `Marvin's move ${Math.ceil((g.tip.ply + 1) / 2)}\n${r.debug}`;
  if (r.resign) return finish(g.human === "w" ? "1-0" : "0-1", "Marvin resigns");
  if (r.flag) return;  // Marvin doesn't make it in time: its clock runs out
  const delay = g.start + r.wait * 1000 + lag() - performance.now();  // charged only r.wait
  setTimeout(() => {
    if (id === g.id && turnId === g.turn && playing()) play(r.move, r.wait, r.think);
  }, Math.max(0, delay));
}

function finish(result, reason) {
  if (g.over) return;
  g.clock[turn()] = remaining(turn());
  g.tip.clock = { ...g.clock };
  g.over = true;
  cg.cancelPremove();
  closePromotion();
  const youWin = result === (g.human === "w" ? "1-0" : "0-1");
  $("status").textContent = `${reason}. ${result === "1/2-1/2" ? "Draw" : youWin ? "You win" : "Marvin wins"}.`;
  drawClocks();
  draw();
  sound(result === "1/2-1/2" ? "Draw" : youWin ? "Victory" : "Defeat");
}

function setMode() {  // analysis on pauses the game; off resumes it from the viewed position
  closePromotion();
  g.turn++;  // drops a Marvin move that is still pending
  if (analysisOn()) {
    if (!g.over && timed()) g.clock[turn()] -= (performance.now() - g.start) / 1000;  // charge the move in progress
    g.tip.clock = { ...g.clock };
    cg.cancelPremove();
    return show(g.view);
  }
  g.tip = g.view;
  g.clock = { ...g.view.clock };
  g.over = false;
  g.busy = false;
  g.start = performance.now();
  $("status").textContent = "";
  refresh();
}

// --- the board and the move tree -------------------------------------------------------------

async function show(node) {
  g.view = node;
  if (!node.state) {
    const st = await post("/state", { moves: pathTo(node).map(n => n.uci) });
    node.state = st;
    if (node.uci) node.san = st.san.at(-1);
    if (g.view !== node) return;
  }
  draw();
  drawClocks();
  analyse(node);
}

function destsFor(st) {  // legal moves for chessground, plus castling by dropping the king on its rook
  const d = new Map();
  const add = (from, to) => d.set(from, [...(d.get(from) || []), to]);
  for (const u of st.legal) if (!(d.get(u.slice(0, 2)) || []).includes(u.slice(2, 4))) add(u.slice(0, 2), u.slice(2, 4));
  for (const [rook, king] of Object.entries(CASTLE))
    if (st.legal.includes(king) && cg.state.pieces.get(king.slice(0, 2))?.role === "king") add(rook.slice(0, 2), rook.slice(2));
  return d;
}

function draw() {  // put the viewed position on the board; also undoes a move chessground made on screen
  const node = g.view, st = node.state;
  if (!st) return;
  if (node !== g.heard) { g.heard = node; moveSound(node); }  // a new position, not a redraw
  const mover = st.fen.split(" ")[1];
  cg.set({ fen: st.fen, turnColor: side(mover), check: st.check ? side(mover) : false,
           lastMove: node.uci ? [node.uci.slice(0, 2), node.uci.slice(2, 4)] : undefined });
  let color, dests = new Map();
  if (analysisOn()) {  // free board: either side
    color = side(mover);
    dests = destsFor(st);
  } else if (playing() && node === g.tip) {  // the game: your pieces, with premoves while Marvin thinks
    color = side(g.human);
    if (mover === g.human) dests = destsFor(st);
  } else cg.cancelPremove();
  cg.set({ movable: { color, dests }, premovable: { enabled: !analysisOn() && playing() } });
  drawMoves();
}

function onUserMove(orig, dest, meta) {
  const st = g.view.state;
  if (!st) return;
  const uci = CASTLE[orig + dest] && st.legal.includes(CASTLE[orig + dest]) ? CASTLE[orig + dest] : orig + dest;
  const options = st.legal.filter(u => u.startsWith(uci.slice(0, 4)));
  if (!options.length) return draw();
  if (options.length === 1) return submit(options[0]);
  if (meta.premove) return play(uci + "q", elapsed());  // premoved promotions become queens, as on Lichess
  choosePromotion(uci, moverAt(g.view));
}

function submit(uci) {
  if (analysisOn()) return explore(uci);
  if (playing() && g.view === g.tip) return play(uci, elapsed());
  draw();
}

async function explore(uci) {  // a move on the free board: follow an existing branch or add one
  const parent = g.view;
  if (!parent.state.legal.includes(uci)) return draw();
  const existing = parent.children.find(n => n.uci === uci);
  if (existing) return show(existing);
  const mover = moverAt(parent);
  // the move's typical think time comes from the analysis (the full list if it's an unlikely move)
  let move = (await analyse(parent))?.moves.find(m => m.uci === uci);
  if (!move) move = (await analyse(parent, true))?.moves.find(m => m.uci === uci);
  const time = move?.time.typical ?? 0;
  const clock = { ...parent.clock };
  if (parent.ply >= 2) clock[mover] = Math.max(0, clock[mover] - time + g.inc);
  const node = { ply: parent.ply + 1, uci, san: null, time: parent.ply >= 2 ? time : g.inc, parent, children: [], clock };
  if (g.view !== parent) return;  // moved on while the analysis loaded
  parent.children.push(node);
  show(node);
}

function choosePromotion(uci, mover) {
  const file = uci.charCodeAt(2) - 97, col = g.human === "w" ? file : 7 - file;
  const top = mover === g.human;  // your promotions are at the top of the board, the opponent's at the bottom
  $("promo").replaceChildren(...Object.entries(ROLES).map(([p, role], k) => {
    const sq = document.createElement("div");
    sq.style.left = `${col * 12.5}%`;
    sq.style.top = `${(top ? k : 7 - k) * 12.5}%`;
    sq.innerHTML = `<piece class="${role} ${side(mover)}"></piece>`;
    sq.onpointerdown = e => { e.stopPropagation(); closePromotion(); submit(uci + p); };
    return sq;
  }));
  $("promo").onpointerdown = () => { closePromotion(); draw(); };  // anywhere else cancels
  $("promo").hidden = false;
}

const closePromotion = () => ($("promo").hidden = true);

function navigate(where) {
  if (!analysisOn() || !g.view) return;
  let n = g.view;
  if (where === "back") n = n.parent || n;
  else if (where === "forward") n = n.children[0] || n;
  else if (where === "start") n = g.root;
  else if (where === "end") while (n.children[0]) n = n.children[0];
  if (n !== g.view) { closePromotion(); show(n); }
}

function drawMoves() {
  const box = $("moves");
  box.replaceChildren();
  const add = (node, number, into) => {
    const span = document.createElement("span");
    span.className = "mv" + (node === g.view ? " cur" : "");
    const n = Math.ceil(node.ply / 2);
    span.textContent = node.ply % 2 ? `${n}. ${node.san ?? "…"}` : number ? `${n}… ${node.san ?? "…"}` : node.san ?? "…";
    span.onclick = () => analysisOn() && show(node);
    into.append(span, " ");
  };
  const line = (parent, number, into) => {  // main continuation of `parent`, then its alternatives in brackets
    const [main, ...alternatives] = parent.children;
    if (!main) return;
    add(main, number, into);
    for (const alt of alternatives) {
      const v = document.createElement("span");
      v.className = "var";
      v.append("(");
      add(alt, true, v);
      line(alt, false, v);
      v.lastChild.textContent = ")";  // replaces the trailing space
      into.append(v, " ");
    }
    line(main, alternatives.length > 0, into);
  };
  line(g.root, false, box);
}

// --- analysis ------------------------------------------------------------------------------

// Only the moves covering TOP_P of the probability are analysed (each needs its own evaluation);
// "⌄" loads the rest. Probabilities are always those of the full distribution.
const topMoves = moves => { let mass = 0; return moves.filter(m => { const keep = mass < TOP_P; mass += m.prob; return keep; }); };

function cached(node, all) {  // analysis loaded for the current ratings; the full list also serves the short one
  const key = JSON.stringify(elo()), a = node.analysis || {};
  if (a.full?.key === key) return a.full.data;
  if (!all && a.top?.key === key) return a.top.data;
  return null;
}

async function analyse(node, all = showAll) {  // returns the analysis data for `node`, fetching it if needed
  if (!analysisOn() || !node.state) return drawAnalysis();
  const hit = cached(node, all);
  drawAnalysis();
  if (hit) return hit;
  if (node.state.legal.length === 0) return null;
  const field = all ? "full" : "top", key = JSON.stringify(elo());
  node.analysis ??= {};
  const pending = node.analysis[field + "Pending"];
  if (pending?.key === key) return pending.request;
  const path = pathTo(node);
  const request = post("/analyse", { moves: path.map(n => n.uci), times: path.map(n => n.time), base: g.base,
                                     inc: g.inc, elo: elo(), clock: node.clock, top_p: all ? 1 : TOP_P });
  node.analysis[field + "Pending"] = { key, request };
  const data = await request;
  node.analysis[field] = { key, data };
  if (g.view === node) drawAnalysis();
  return data;
}

const pct = x => `${(x * 100).toFixed(x < 0.1 ? 1 : 0)}%`;

function wdlBar(wdl) {
  const bar = document.createElement("div");
  bar.className = "wdlbar";
  bar.title = `White ${pct(wdl.white)} · Draw ${pct(wdl.draw)} · Black ${pct(wdl.black)}`;
  for (const [key, cls] of [["white", "w"], ["draw", "d"], ["black", "b"]]) {
    const s = document.createElement("span");
    s.className = cls;
    s.style.width = `${wdl[key] * 100}%`;
    if (wdl[key] > 0.12) s.textContent = `${Math.round(wdl[key] * 100)}%`;
    bar.append(s);
  }
  return bar;
}

// Think times: hundredths below a second (models with sub-second timing), tenths above.
const secs = x => `${x.toFixed(x < 1 ? 2 : 1)}s`;

function timeLabel(t) {
  const stat = ["typical", "mean", "mode"].includes($("think_time").value) ? $("think_time").value : "typical";
  return `≈${secs(t[stat])}`;
}

function cell(text, cls) {
  const td = document.createElement("td");
  if (cls) td.className = cls;
  if (text instanceof Node) td.append(text); else td.textContent = text;
  return td;
}

function drawAnalysis() {
  const box = $("analysis"), node = g?.view;
  if (!analysisOn() || !node) return;
  if (node.state && node.state.legal.length === 0) { box.replaceChildren(); return; }
  const a = cached(node, showAll);
  box.classList.toggle("stale", !a);  // keep the previous table, dimmed, until this one arrives
  if (!a) return;
  const rows = showAll ? a.moves : topMoves(a.moves);
  const table = document.createElement("table");
  table.innerHTML = "<thead><tr><th>Move</th><th class=num>Policy</th><th class=time>Time</th><th>White / Draw / Black</th></tr></thead>";
  const body = document.createElement("tbody");
  for (const m of rows) {
    const tr = document.createElement("tr");
    const time = cell(timeLabel(m.time), "time");
    time.onmouseenter = () => showPopup(time, m);
    time.onmouseleave = () => ($("popup").hidden = true);
    if (NO_HOVER) time.onclick = e => {  // touch screens: tap the time for its histogram, not the move
      e.stopPropagation();
      const popup = $("popup");
      if (!popup.hidden && popup.dataset.move === m.uci) popup.hidden = true;
      else { showPopup(time, m); popup.dataset.move = m.uci; }
    };
    tr.append(cell(m.san), cell(pct(m.prob), "num"), time, cell(wdlBar(m.wdl), "wdl"));
    tr.onmouseenter = () => cg.setAutoShapes([{ orig: m.uci.slice(0, 2), dest: m.uci.slice(2, 4), brush: "paleBlue" }]);
    tr.onmouseleave = () => cg.setAutoShapes([]);
    tr.onclick = () => {
      if (node !== g.view || box.classList.contains("stale")) return;  // this row is for another position
      cg.setAutoShapes([]);
      submit(m.uci);
    };
    body.append(tr);
  }
  const sum = document.createElement("tr");
  sum.className = "sum";
  const total = cell("Σ");
  total.title = "The model's expected result for this position";
  sum.append(total, cell("100%", "num"), cell(""), cell(wdlBar(a.wdl), "wdl"));
  body.append(sum);
  table.append(body);
  const foot = document.createElement("div");
  foot.className = "foot";
  const odds = document.createElement("span");
  odds.textContent = `Resign ${pct(a.resign)} · Flag ${pct(a.flag)}`;
  foot.append(odds);
  if (rows.length < a.legal || showAll) {
    const more = document.createElement("button");
    more.textContent = showAll ? "⌃" : "⌄";
    more.title = showAll ? "Show fewer moves" : "Show all moves";
    more.onclick = () => { showAll = !showAll; analyse(g.view); };
    foot.append(more);
  }
  box.replaceChildren(table, foot);
}

if (NO_HOVER) document.addEventListener("click", () => ($("popup").hidden = true));

function showPopup(anchor, m) {
  const t = m.time, popup = $("popup");
  // Every move gets the same 40 bars, equally wide in log(1 + seconds) from 0 to 120 s
  // (marvin.engine.BAR_EDGES): fine near 0 for quick moves, coarse for long thinks.
  const peak = Math.max(...t.bins);
  const chart = t.bins.map(p => `<i style="height:${(p / peak) * 100}%"></i>`).join("");
  const at = s => (100 * Math.log1p(s) / Math.log1p(120)).toFixed(1);
  const ticks = [[0, "0s"], [1, "1s"], [5, "5s"], [30, "30s"], [120, "120s+"]]
    .map(([s, label]) => `<span style="left:${at(s)}%">${label}</span>`).join("");
  popup.innerHTML = `<div class="chart">${chart}</div><div class="axis">${ticks}</div>
    <div class="stats"><span>Mode ${secs(t.mode)}</span><span>Typical ${secs(t.typical)}</span><span>Mean ${secs(t.mean)}</span></div>`;
  popup.hidden = false;
  const r = anchor.getBoundingClientRect();
  popup.style.left = `${Math.max(8, Math.min(innerWidth - 264, r.left + r.width / 2 - 128))}px`;
  popup.style.top = `${r.bottom + 6 + 110 > innerHeight ? r.top - 110 : r.bottom + 6}px`;
}

// --- sound -------------------------------------------------------------------------------

// Lichess's standard set, fetched by the server from Lichess on first use
const SOUNDS = Object.fromEntries(["Move", "Capture", "Check", "Checkmate", "LowTime", "GenericNotify", "Victory",
                                   "Defeat", "Draw"].map(n => [n, new Audio(`/static/sound/${n}.mp3`)]));

function sound(name) {
  if (!$("sound").checked) return;
  // a fresh copy each time, so a premove's sound plays over the move it answers instead of cutting it off
  SOUNDS[name].cloneNode().play().catch(() => {});  // missing file, or no user gesture yet
}

function moveSound(node) {  // as on Lichess: the move or capture, then check or mate
  if (!node.san) return;
  sound(node.san.includes("x") ? "Capture" : "Move");
  if (node.san.includes("#")) sound("Checkmate");
  else if (node.san.includes("+")) sound("Check");
}

// --- clocks --------------------------------------------------------------------------------

function fmt(s) {
  s = Math.max(0, s);
  if (s < 10) return `0:0${s.toFixed(1)}`;
  return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
}

function drawClocks() {  // the running game clocks, or on the free board those of the viewed position
  const free = analysisOn();
  for (const [el, c] of [[$("topClock"), g.bot], [$("botClock"), g.human]]) {
    const left = free ? g.view.clock[c] : remaining(c);
    el.textContent = fmt(left);
    el.classList.toggle("on", !free && playing() && timed() && turn() === c);
    el.classList.toggle("low", left < 10);
  }
}

setInterval(() => {
  if (!g || !g.tip.state || !playing()) return;
  drawClocks();
  const c = turn();
  // As on Lichess: one warning when your clock drops below an eighth of the base time (10-60 s),
  // again only after increments have taken it back well above that
  const low = Math.min(60, Math.max(10, g.base / 8)), left = remaining(g.human);
  if (c === g.human && timed() && left < low && !g.lowWarned) { g.lowWarned = true; sound("LowTime"); }
  else if (left > low * 1.5) g.lowWarned = false;
  const grace = c === g.bot ? lag() / 1000 : 0;  // Marvin's move may still be "in flight"
  if (timed() && remaining(c) + grace <= 0) finish(g.tip.state.material[other(c)] ? (c === "w" ? "0-1" : "1-0") : "1/2-1/2", "Time");
}, 100);

addEventListener("resize", () => cg?.redrawAll());
addEventListener("keydown", e => {
  if (e.target.matches("input[type=number], select")) return;  // arrow keys edit these
  const where = { ArrowLeft: "back", ArrowRight: "forward", Home: "start", End: "end" }[e.key];
  if (where && analysisOn()) { e.preventDefault(); navigate(where); }
});
for (const b of document.querySelectorAll("#nav button")) b.onclick = () => navigate(b.dataset.nav);
window.marvin = { get game() { return g; }, get board() { return cg; }, moves: () => pathTo(g.tip).map(n => n.uci), show };  // for the browser console
$("new").onclick = newGame;
$("resign").onclick = () => g && playing() && finish(g.human === "w" ? "0-1" : "1-0", "You resigned");
for (const id of Object.keys(SETTINGS)) $(id).onchange = () => { savePrefs(); drawAnalysis(); };
for (const id of ["bot", "you"]) $(id).onchange = () => { savePrefs(); drawNames(); g && analyse(g.view); };
$("sound").onchange = savePrefs;
$("showDebug").onchange = () => { savePrefs(); cg?.redrawAll(); };
$("showAnalysis").onchange = () => { savePrefs(); cg?.redrawAll(); if (g) setMode(); };
newGame();
</script>
</body>
</html>
